<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>آزمایش حرکت گلفر</title><style>*{box-sizing:border-box}body{margin:0;background:#172b23;color:#eee9d9;font:14px/1.8 system-ui}main{display:grid;grid-template-columns:minmax(0,1fr) 290px;height:100dvh}#stage{min-width:0;position:relative}canvas{display:block;width:100%;height:100%;touch-action:none}aside{padding:18px;overflow:auto;background:#20392e}h1{font-size:19px;margin:0 0 12px}label{display:block;margin:10px 0}button,select,input{font:inherit;accent-color:#d8c493}button,select{color:inherit;background:#ffffff12;border:1px solid #ffffff35;border-radius:8px;min-height:44px;padding:6px 10px}select,input[type=range]{width:100%}.phases{display:grid;grid-template-columns:1fr 1fr;gap:5px}pre{white-space:pre-wrap;direction:ltr;text-align:left;font:10px/1.7 monospace}small{color:#ccd5c8}button[aria-pressed=true]{background:#d8c49330;border-color:#d8c493}#status{position:absolute;bottom:12px;left:12px;color:#172b23;background:#f2eddcbb;padding:5px 10px;border-radius:7px;font-size:12px}@media(max-width:700px){main{grid-template-columns:1fr;grid-template-rows:60dvh 1fr;height:auto}aside{height:40dvh;padding:12px}.phases{grid-template-columns:repeat(4,1fr)}h1{font-size:16px}}</style><main><div id="stage"><span id="status">بارگذاری مدل اصلی…</span></div><aside><h1>آزمایش بدن و سویینگ</h1><small>همان مدل و ریگ بازی؛ بدون فیزیک یا تغییر راند. مراحل قابل توقف و بررسی‌اند.</small><label>کلاب<select id="club"><option value="7I">7 Iron</option><option value="1W">Driver</option><option value="SW">Sand wedge</option><option value="PT">Putter</option></select></label><label>حرکت<select id="mode"><option value="full">Full</option><option value="three-quarter">¾</option><option value="half">Half</option><option value="chip">Chip</option><option value="putt">Putt</option></select></label><div class="phases"><button data-t="0">آدرس</button><button data-t="0.07">برداشت اولیه ≈۴۵°</button><button data-t="0.28">بالاآمدن دست</button><button data-t="0.4">بالای سویینگ</button><button data-t="0.477">پیش از برخورد</button><button data-t="0.5">برخورد</button><button data-t="0.73">عبور</button><button data-t="1">فینیش</button></div><label>مرحله <output id="frame">0</output><input id="seek" type="range" min="0" max="100" step="0.1" value="0"></label><button id="play">پخش آهسته</button><label>زاویهٔ دید<select id="view"><option value="front">روبروی بدن</option><option value="line">روی خط هدف</option><option value="three">سه‌ربع</option><option value="hands">دست‌ها و گریپ</option></select></label><label><input id="skeleton" type="checkbox"> نمایش استخوان‌بندی</label><button id="export">دریافت اندازه‌گیری‌ها</button><pre id="metrics"></pre></aside></main><script src="./three.min.js"></script><script src="./GLTFLoader.js"></script><script src="./golfer-rig.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color('#d8ddd3');scene.add(new THREE.HemisphereLight(0xffffff,0x607361,1.25));const sun=new THREE.DirectionalLight(0xfff4df,1.5);sun.position.set(-3,6,4);scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x9fae98,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.004;scene.add(floor);const grid=new THREE.GridHelper(12,24,0x849581,0xb7c2b1);grid.position.y=.001;scene.add(grid);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;document.getElementById('stage').prepend(renderer.domElement);const camera=new THREE.PerspectiveCamera(38,1,.01,100);const ballMesh=new THREE.Mesh(new THREE.SphereGeometry(.021335,20,14),new THREE.MeshStandardMaterial({color:0xffffff}));scene.add(ballMesh);const targetLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-3,.003,.7),new THREE.Vector3(3,.003,.7)]),new THREE.LineBasicMaterial({color:0xc4a75e}));scene.add(targetLine);
let athlete,skeleton,progress=0,playing=false,last=0;const bag={'1W':{id:'1W',cat:'wood',loft:12},'7I':{id:'7I',cat:'iron',loft:31.5},SW:{id:'SW',cat:'wedge',loft:54},PT:{id:'PT',cat:'putter',loft:2.5,isPutter:true}};const $=id=>document.getElementById(id);
function phase(t){return t<=.4?['backswing',t/.4]:t<=.5?['downswing',(t-.4)/.1]:['followthrough',(t-.5)/.5]}
function metrics(){const a=athlete,d=a.debug(),q=a.model.getWorldQuaternion(new THREE.Quaternion()),face=a.impactNormal.clone().applyQuaternion(q),front=new THREE.Vector3(0,0,1).applyQuaternion(a.bones.Chest.getWorldQuaternion(new THREE.Quaternion()));return{...d,faceNormal:face.toArray(),faceTowardTarget:face.x,chestFront:front.toArray(),handRotations:a.handRotations?Object.fromEntries(Object.entries(a.handRotations).map(([k,v])=>[k,v.toArray()])):null,arm:a.armDiagnostics,gripCorrection:a.gripCorrection}}
function draw(t=progress){if(!athlete)return;progress=+t;$('seek').value=progress*100;$('frame').textContent=(progress*100).toFixed(1);const club=bag[$('club').value],mode=club.isPutter?'putt':$('mode').value;athlete.setClub(club);const st=GolfAthlete.address(club,mode),ball=new THREE.Vector3(st.lead,.021335,st.distance);athlete.setContact(ball,.021335);athlete.setGroundSampler(()=>0,()=>new THREE.Vector3(0,1,0));ballMesh.position.copy(ball);targetLine.position.z=st.distance-.7;athlete.pose(mode,...phase(progress));athlete.model.updateMatrixWorld(true);skeleton.visible=$('skeleton').checked;skeleton.update();const center=new THREE.Vector3(0,1,0);if($('view').value==='hands'){center.copy(athlete.bones['Hand.L'].getWorldPosition(new THREE.Vector3())).lerp(athlete.bones['Hand.R'].getWorldPosition(new THREE.Vector3()),.5);camera.position.copy(center).add(new THREE.Vector3(.35,.15,.58))}else if($('view').value==='front')camera.position.set(0,1.25,4.7);else if($('view').value==='line')camera.position.set(-4.7,1.35,.6);else camera.position.set(-3.3,1.7,3.5);camera.lookAt(center);camera.updateMatrixWorld(true);$('metrics').textContent=JSON.stringify(metrics(),null,1);$('status').textContent='هدف: جهت +X طلایی · توپ: جلوی بدن +Z';document.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-pressed',String(Math.abs(+b.dataset.t-progress)<.001)));renderer.render(scene,camera)}
function resize(){const r=$('stage').getBoundingClientRect();renderer.setSize(r.width,r.height);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();draw()};new ResizeObserver(resize).observe($('stage'));
new THREE.GLTFLoader().load('./pro_golfer_character.glb',g=>{athlete=new GolfAthlete(g);scene.add(athlete.model);skeleton=new THREE.SkeletonHelper(athlete.model);skeleton.material.depthTest=false;skeleton.material.transparent=true;skeleton.material.opacity=.65;scene.add(skeleton);window.lab={athlete,draw,metrics,renderer,scene,camera,phase,bag};resize();draw(0)},undefined,e=>$('status').textContent='خطا در بارگذاری مدل');
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{playing=false;draw(+b.dataset.t)});$('seek').oninput=()=>{playing=false;draw(+$('seek').value/100)};for(const id of ['club','mode','view','skeleton'])$(id).onchange=()=>draw();$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'توقف':'پخش آهسته';if(progress>=1)progress=0};$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(metrics(),null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='golfer-motion.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};function animate(now){if(playing&&athlete){progress=Math.min(1,progress+Math.min(.1,(now-last)/1000)*.14);draw();if(progress===1)playing=false}last=now;requestAnimationFrame(animate)}requestAnimationFrame(animate);
</script></html>
